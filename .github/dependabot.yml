version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    groups:
      gomod:
        patterns:
          - '*'      
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    groups:
      gh:
        patterns:
          - '*'    
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
